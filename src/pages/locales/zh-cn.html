<body>
<header>
<div class="header-title">
<img alt="" aria-hidden="true" class="header-brand-icon" src="assets/favicon.png"/>
<h1 data-i18n="title">WARDOGS // 炮兵计算器</h1>
<span data-i18n="gridInfo">1 km → 10×10 个 100 m 网格</span>
</div>
<div class="header-controls">
<button aria-label="Toggle theme" class="theme-toggle" id="themeToggle" title="Toggle theme" type="button">
<span id="themeIcon">☼</span>
</button>
<select class="language-select" id="language"></select>
</div>
</header>
<main>
<aside>
<!-- MAP -->
<div class="section">
<h2 data-i18n="map">地图</h2>
<label data-i18n="presetMap">预设地图</label>
<select id="mapSelect"></select>
<div id="customMapSizing">
<div class="grid2" style="margin-top:7px">
<div>
<label data-i18n="width">宽度，km</label>
<input id="w" max="100" min="1" type="number" value="10"/>
</div>
<div>
<label data-i18n="height">高度，km</label>
<input id="h" max="100" min="1" type="number" value="10"/>
</div>
</div>
<button class="primary" data-i18n="apply" id="apply" style="margin-top:8px">应用</button>
</div>
</div>
<!-- WEAPON -->
<div class="section">
<h2 data-i18n="weapon">武器</h2>
<label data-i18n="weaponType">武器类型</label>
<select id="weapon"></select>
<div class="result" style="margin-top:8px">
<div class="row">
<span data-i18n="weaponRange">射程</span>
<b id="range">
                        600 m
                    </b>
</div>
<div class="row">
<span data-i18n="targetStatus">目标状态</span>
<b id="rangeStatus">
                        In range
                    </b>
</div>
</div>
<p class="hint" data-i18n="rangeHint">圆圈表示所选武器相对于炮位的最小和最大射程。</p>
</div>
<!-- POINT SELECTION -->
<div class="section">
<h2 data-i18n="pointSelection">位置选择</h2>
<div class="mode">
<button class="active" data-i18n="artillery" id="originMode">炮位</button>
<button data-i18n="target" id="targetMode">目标</button>
</div>
<label data-i18n="artilleryXY">炮位 X / Y</label>
<div class="grid2">
<input id="ox" step="0.01" type="number" value="2000"/>
<input id="oy" step="0.01" type="number" value="2000"/>
</div>
<div class="point-coordinate-actions">
<button data-i18n="copyCoordinates" id="coordinateOriginCopy" type="button">复制</button>
<button data-i18n="pasteCoordinates" id="coordinateOriginPaste" type="button">粘贴</button>
<button aria-pressed="false" class="point-lock-button" id="coordinateOriginLock" type="button">Lock</button>
</div>
<label data-i18n="targetXY">目标 X / Y</label>
<div class="grid2">
<input id="tx" step="0.01" type="number" value="2500"/>
<input id="ty" step="0.01" type="number" value="2500"/>
</div>
<div class="point-coordinate-actions">
<button data-i18n="copyCoordinates" id="coordinateTargetCopy" type="button">复制</button>
<button data-i18n="pasteCoordinates" id="coordinateTargetPaste" type="button">粘贴</button>
<button aria-pressed="false" class="point-lock-button" id="coordinateTargetLock" type="button">Lock</button>
</div>
</div>
<!-- RESULT -->
<div class="section">
<h2 data-i18n="result">射击解算</h2>
<div class="result solution-result">
<div class="solution-primary-grid">
<div class="solution-metric">
<span class="solution-metric-label" data-i18n="distance">距离</span>
<strong class="solution-metric-value" id="distm">707 m</strong>
<span class="solution-metric-sub" id="dist">0.71 km</span>
</div>
<div class="solution-metric solution-metric-highlight">
<span class="solution-metric-label" data-i18n="mil">MIL</span>
<strong class="solution-metric-value" id="mil">—</strong>
<span class="solution-metric-sub" id="milAlt" hidden></span>
</div>
<div class="solution-metric">
<span class="solution-metric-label" data-i18n="azimuth">方位角</span>
<strong class="solution-metric-value" id="angle">45.0°</strong>
<span class="solution-metric-sub solution-metric-spacer" aria-hidden="true">&nbsp;</span>
</div>
</div>
<div class="solution-secondary-grid">
<div class="solution-secondary-item"><span>ΔX</span><b id="dx">+500 m</b></div>
<div class="solution-secondary-item"><span>ΔY</span><b id="dy">+500 m</b></div>
</div>
</div>
<p class="hint" data-i18n="azimuthHint">方位角：0° 北，90° 东，180° 南，270° 西。</p>
</div>
<!-- CONTROLS -->
<div class="section">
<h2 data-i18n="controls">控制</h2>
<div class="grid2">
<button id="zoomOut">
                    −
                </button>
<button id="zoomIn">
                    +
                </button>
</div>
<button data-i18n="fit" id="fit" style="margin-top:7px">适应地图</button>
<button data-i18n="swap" id="swap" style="margin-top:7px">交换位置</button>
<button data-i18n="clear" id="clear" style="margin-top:7px">重置</button>
</div>
</aside>
<button aria-label="Hide sidebar" aria-expanded="true" class="sidebar-toggle" id="sidebarToggle" title="Hide sidebar" type="button">
<span aria-hidden="true" class="sidebar-toggle-icon">‹</span>
</button>
<!-- WORKSPACE -->
<section class="workspace">
<div class="toolbar">
<span class="status" id="status"></span>
</div>
<div class="map">
<canvas id="canvas"></canvas>
<!-- CURSOR -->
<div class="cursor-coords" id="cursorCoords">
<span class="cursor-y">
          y0.00
        </span>
<span class="cursor-x">
          x0.00
        </span>
</div>
<!-- SAVED TARGETS -->
<div class="saved-targets">
<div class="saved-targets-header">
<span data-i18n="savedTargets">已保存目标</span>
<span class="saved-targets-count" id="savedTargetsCount">
      0
    </span>
</div>
<div class="saved-targets-list" id="savedTargetsList"></div>
<div class="saved-target-options">
<label class="save-artillery-option">
<input id="saveArtilleryPosition" type="checkbox"/>
<span data-i18n="saveArtilleryPosition">同时保存炮位</span>
</label>
</div>
<div class="saved-target-actions">
<button class="save-target-button" data-i18n="save" id="saveTarget" type="button">保存</button>
<div class="saved-target-transfer-actions">
<button data-i18n="exportAllTargets" id="exportSavedTargets" type="button">全部导出</button>
<button data-i18n="importTargets" id="importSavedTargets" type="button">导入</button>
</div>
<div aria-live="polite" class="saved-target-transfer-status" id="savedTargetsTransferStatus"></div>
</div>
</div>
<!-- MAP TOOLS -->
<div class="map-tools" id="mapTools">
<div class="map-tool-popover map-tool-palette" id="pencilPalette"></div>
<div class="map-tool-popover map-tool-marker-picker" id="markerPicker"></div>
<div class="map-tool-popover map-tool-coordinate-search" id="coordinateSearchPopover">
<div class="map-tool-popover-title" id="coordinateSearchTitle">Coordinate search</div>
<div class="map-tool-search-grid">
<input id="coordinateSearchX" inputmode="numeric" placeholder="X" type="number"/>
<input id="coordinateSearchY" inputmode="numeric" placeholder="Y" type="number"/>
</div>
<button class="map-tool-search-go" id="coordinateSearchGo" type="button">Go</button>
<div class="map-tool-search-error" id="coordinateSearchError"></div>
</div>
<div class="map-tool-popover map-tool-layers" id="mapLayersPopover"></div>
<div class="map-tool-popover map-tool-data-transfer" id="mapDataTransferPopover"></div>
<div class="map-tools-bar">
<button aria-label="Ruler" class="map-tool-button" data-tool="ruler" id="mapToolRuler" title="Ruler" type="button">
<svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M4 17.5 17.5 4 20 6.5 6.5 20 4 17.5Z"/>
<path d="m13 8.5 2.5 2.5"/>
<path d="m10 11.5 1.8 1.8"/>
<path d="m7 14.5 2.5 2.5"/>
</svg>
</button>
<button aria-label="Pencil" class="map-tool-button" data-tool="pencil" id="mapToolPencil" title="Pencil" type="button">
<svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M4 20l4.2-1 10.6-10.6-3.2-3.2L5 15.8 4 20Z"/>
<path d="m14.8 6 3.2 3.2"/>
</svg>
</button>
<button aria-label="Eraser" class="map-tool-button" data-tool="eraser" id="mapToolEraser" title="Eraser" type="button">
<svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="m4.5 14.5 8-8a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L10 19H6.5L4.5 17a1.8 1.8 0 0 1 0-2.5Z"/>
<path d="m9.5 9.5 5 5"/>
<path d="M10 19h9"/>
</svg>
</button>
<button aria-label="Markers" class="map-tool-button" data-tool="marker" id="mapToolMarker" title="Markers" type="button">
<svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
<circle cx="12" cy="12" r="4"/>
<path d="M12 3v5M12 16v5M3 12h5M16 12h5"/>
</svg>
</button>
<button aria-label="Coordinate search" class="map-tool-button" data-tool="coordinateSearch" id="mapToolCoordinateSearch" title="Coordinate search" type="button">
<svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<circle cx="10.5" cy="10.5" r="5.5"/>
<path d="m15 15 5 5"/>
</svg>
</button>
<button aria-label="Layers" class="map-tool-button" data-tool="layers" id="mapToolLayers" title="Layers" type="button">
<svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
<path d="M5 7h2M10 7h9M5 12h2M10 12h9M5 17h2M10 17h9"/>
</svg>
</button>
<button aria-label="Import / Export" class="map-tool-button" data-tool="dataTransfer" id="mapToolDataTransfer" title="Import / Export" type="button">
<svg aria-hidden="true" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v10"/><path d="m4 11 3 3 3-3"/><path d="M17 20V10"/><path d="m14 13 3-3 3 3"/></svg>
</button>
<button aria-label="Fullscreen" class="map-tool-button map-tool-fullscreen-button" id="mapToolFullscreen" title="Fullscreen" type="button">
<svg aria-hidden="true" class="map-tool-fullscreen-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M8 4H4v4M16 4h4v4M8 20H4v-4M16 20h4v-4"/>
</svg>
</button>
</div>
</div>
</div>
</section>
