name: Security checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: node:22-bookworm
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install application dependencies
        run: npm ci

      - name: Install Worker dependencies
        run: npm --prefix sync ci

      - name: Audit application dependencies
        run: npm audit --audit-level=high

      - name: Audit Worker dependencies
        run: npm --prefix sync audit --audit-level=high

      - name: Test and verify production build
        run: npm run check

      - name: Verify Worker deployment bundle
        run: npm --prefix sync exec -- wrangler deploy --dry-run --config sync/wrangler.jsonc
