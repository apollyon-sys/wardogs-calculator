name: Security checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sync/package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Install lobby dependencies
        working-directory: sync
        run: npm ci

      - name: Run tests
        run: npm run test:scripts && npm --prefix sync test

      - name: Audit dependencies
        run: npm audit --audit-level=high && npm --prefix sync audit --audit-level=high

      - name: Build production site
        run: npm run build

      - name: Verify production artifact
        run: npm run test:build

      - name: Validate Worker bundle
        working-directory: sync
        run: npx wrangler deploy --dry-run
